services:
  # API Service (Express Backend)
  - type: web
    name: pgkhata-api
    runtime: node
    region: singapore
    branch: staging
    plan: free
    buildCommand: npm install -g pnpm@10.15.1 && pnpm install --frozen-lockfile && pnpm --filter @pgkhata/api build
    preDeployCommand: pnpm --filter @pgkhata/db migrate:deploy
    startCommand: pnpm --filter @pgkhata/api start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

  # Web Service (Next.js Frontend)
  - type: web
    name: pgkhata-web
    runtime: node
    region: singapore
    branch: staging
    plan: free
    buildCommand: npm install -g pnpm@10.15.1 && pnpm install --frozen-lockfile && pnpm --filter web build
    startCommand: pnpm --filter web start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        value: https://pgkhata-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: /api/backend
      - key: NEXT_PUBLIC_APP_URL
        sync: false
