services:
  # API Service (Express Backend)
  - type: web
    name: pgkhata-api
    runtime: node
    region: singapore
    branch: main
    plan: free
    buildCommand: npx pnpm@10.15.1 install --frozen-lockfile && npx pnpm@10.15.1 --filter @pgkhata/api build
    preDeployCommand: npx pnpm@10.15.1 --filter @pgkhata/db migrate:deploy
    startCommand: node apps/api/dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3001"
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: APP_URL
        sync: false
      # Where "Exit support session" returns an admin to. Without it the API
      # falls back to http://localhost:3002 and the exit link is dead in prod.
      - key: ADMIN_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false

  # Web Service (Next.js Frontend)
  - type: web
    name: pgkhata-web
    runtime: node
    region: singapore
    branch: main
    plan: free
    buildCommand: npx pnpm@10.15.1 install --frozen-lockfile && npx pnpm@10.15.1 --filter web build
    startCommand: cd apps/web && npx next start
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_URL
        value: https://pgkhata-api.onrender.com
      - key: NEXT_PUBLIC_API_URL
        value: /api/backend
      - key: NEXT_PUBLIC_APP_URL
        sync: false
