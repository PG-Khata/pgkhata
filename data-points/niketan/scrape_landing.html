    <title>Niketan — Run your PG like a well-kept ledger</title>
    <script>
      (function () {
        try {
          var stored = JSON.parse(localStorage.getItem("niketan-theme") || "{}");
          var state = stored.state || {};
          var mode = state.mode || "system";
          var accent = state.accent || "tulsi";
          var resolved =
            mode === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : mode;
          document.documentElement.classList.add(resolved);
          document.documentElement.setAttribute("data-theme", accent);
        } catch (e) {}
      })();
    </script>
